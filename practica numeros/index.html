<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparación De Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="cabecera"> 
        <h1>Organizador de números</h1>
        <p>Ejercicio de lógica y programación | JavaScript</p>
    </div>    
   
    <main class="contenedor-principal">
        <section class="card">
            <h2 id="titulo">Números ingresados</h2>
            <h3 id="numero1">Número 1: 0</h3>
            <h3 id="numero2">Número 2: 0</h3>
            <h3 id="numero3">Número 3: 0</h3>
        </section>

        <section class="card">
            <h2 id="t2">Números de Mayor a Menor</h2>
            <h3 id="N-mayor1">Número 1: 0</h3>
            <h3 id="N-centro1">Número 2: 0</h3>
            <h3 id="N-menor1">Número 3: 0</h3>
        </section>

        <section class="card">
            <h2 id="t3">Números de Menor a Mayor</h2>
            <h3 id="N-menor2">Número 1: 0</h3>
            <h3 id="N-centro2">Número 2: 0</h3>
            <h3 id="N-mayor2">Número 3: 0</h3>
        </section>
    </main>
   
    <script src="numeros.js"></script>
</body>
</html>
